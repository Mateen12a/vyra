# Vyrani at https://vyrani.com. Cloudflare proxies the domain with SSL/TLS "Full (strict)"; the Cloudflare Origin
# certificates below stay on the server. www and the old testing address redirect permanently to vyrani.com.
map $http_upgrade $vyrani_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name vyrani.com www.vyrani.com vyrani.blackhevents.com;
    return 301 https://vyrani.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vyrani.com;
    ssl_certificate /etc/ssl/certs/vyrani-origin.pem;
    ssl_certificate_key /etc/ssl/private/vyrani-origin.key;
    return 301 https://vyrani.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vyrani.blackhevents.com;
    ssl_certificate /etc/ssl/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;
    return 301 https://vyrani.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vyrani.com;

    ssl_certificate /etc/ssl/certs/vyrani-origin.pem;
    ssl_certificate_key /etc/ssl/private/vyrani-origin.key;
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vyrani_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
